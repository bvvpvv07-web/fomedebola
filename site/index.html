<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fome de Bola · simulador de carreira no futebol</title>
<meta name="description" content="Fome de Bola: simulador de carreira no futebol. Da peneira à Bola de Ouro, com lances no estilo New Star Soccer, vida fora de campo e ranking.">
<meta name="theme-color" content="#0b1f15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fome de Bola">
<meta property="og:title" content="Fome de Bola"><meta property="og:description" content="Simulador de carreira no futebol: da peneira à Bola de Ouro."><meta property="og:image" content="og.png"><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Saira+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de "prancheta" sobre gramado listrado; header fixo com o jogador, conteúdo em cards de giz */
:root{
  --pitch:#0c2318; --pitch-2:#102b1e; --panel:#143424; --panel-2:#1a4130;
  --line:rgba(236,240,226,.13); --line-2:rgba(236,240,226,.24);
  --chalk:#ecf0e2; --muted:#9fb3a2; --dim:#6f8a77;
  --accent:#ff7a2b; --accent-ink:#1b0d03; --gold:#f2c443; --bad:#ff6a5c; --good:#a6e39a; --blue:#7cc4ff;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--pitch);background-image:repeating-linear-gradient(180deg,var(--pitch) 0 72px,var(--pitch-2) 72px 144px);background-attachment:fixed;color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:13px 18px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line-2)}
.btn.small{font-size:15px;padding:9px 13px}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line)}
.chip.up{color:var(--good);border-color:rgba(166,227,154,.35)}
.chip.down{color:var(--bad);border-color:rgba(255,106,92,.35)}
.chip.gold{color:var(--gold);border-color:rgba(242,196,67,.4)}
.tag{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--accent);color:var(--accent-ink)}
.tag.vida{background:var(--blue);color:#06192a}
.tag.campo{background:var(--accent)}
.tag.sel{background:var(--gold);color:#241a00}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:radial-gradient(circle at 50% 120%,rgba(255,122,43,.18),transparent 60%),var(--panel);padding:34px 22px 26px}
.hero::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border:2px solid var(--line);border-radius:50%}
.hero::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--line)}
.hero > *{position:relative;z-index:1}
.logo{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(56px,15vw,112px);line-height:.82;text-transform:uppercase;letter-spacing:-.01em}
.logo span{color:var(--accent);display:block}
.hero p{max-width:46ch;color:var(--muted);font-size:16px;margin:14px 0 20px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.how b{font-family:var(--f-display);font-size:20px;display:block;margin-bottom:2px}
.ladder{display:grid;gap:4px}
.ladder div{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--muted)}
.ladder div b{font-family:var(--f-mono);color:var(--chalk);width:22px}

/* CREATE */
.field{display:flex;flex-direction:column;gap:6px}
.input{background:var(--pitch);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;color:var(--chalk);font:600 17px var(--f-body);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:var(--pitch);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;font-weight:600;font-size:14px}
.opt.on{background:var(--chalk);color:var(--pitch);border-color:var(--chalk)}
.pitch{position:relative;width:100%;max-width:420px;aspect-ratio:68/80;margin:0 auto;border-radius:12px;background:repeating-linear-gradient(180deg,#1d5236 0 10%,#1a4a31 10% 20%);border:2px solid rgba(236,240,226,.55);overflow:hidden}
.pitch .ln{position:absolute;border:2px solid rgba(236,240,226,.45)}
.pbtn{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.05em;padding:7px 10px;border-radius:8px;background:rgba(12,35,24,.85);border:1.5px solid rgba(236,240,226,.6);color:var(--chalk);min-width:50px}
.pbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,122,43,.25)}
.posinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:4px}
.posinfo div{background:var(--pitch);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.posinfo small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-mono)}
.posinfo b{font-size:14px}

/* DRAFT */
.legend{display:flex;gap:14px;align-items:center}
.legend .face{width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:26px;background:var(--gold);color:#241a00}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{border-radius:10px;border:1px solid var(--line-2);background:var(--pitch);padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.slot .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.slot .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.slot .w{font-size:11px;color:var(--dim)}
.slot.filled{border-color:transparent;background:var(--panel-2);cursor:default}
.slot.take{border-color:var(--accent);background:rgba(255,122,43,.09)}
.slot.take:hover{background:rgba(255,122,43,.18)}
.slot.take .v{color:var(--accent)}
.slot.useless .w{color:var(--bad)}
.potbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.potnum{font-family:var(--f-display);font-weight:900;font-size:54px;line-height:.9;color:var(--accent)}
.mini{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;flex:1;min-width:240px}
.mini div{text-align:center;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.mini div i{display:block;height:34px;border-radius:4px;background:var(--panel-2);position:relative;overflow:hidden;margin-bottom:3px}
.mini div i s{position:absolute;left:0;right:0;bottom:0;background:var(--dim)}
.mini div.me i s{background:var(--accent)}
.mini div.me{color:var(--chalk)}

/* HEADER */
.ph{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(12,35,24,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.ph-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.ph .who{flex:1;min-width:0}
.ph .who b{font-family:var(--f-display);font-size:22px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.ph .who > span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ovr{text-align:center;line-height:.9}
.ovr b{font-family:var(--f-display);font-size:40px;font-weight:900;color:var(--accent);display:block}
.ovr small{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
.shield{flex:none;width:38px;height:44px;clip-path:polygon(50% 0,100% 12%,100% 62%,50% 100%,0 62%,0 12%);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.02em}
.shield.lg{width:54px;height:62px;font-size:16px}
.shield.sm{width:26px;height:30px;font-size:9px}
.flagbox{font-size:22px;line-height:1}

.life{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.life{grid-template-columns:repeat(2,1fr)}}
.bar small{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bar i{display:block;height:7px;border-radius:4px;background:var(--pitch);margin-top:4px;overflow:hidden}
.bar i s{display:block;height:100%;border-radius:4px;transition:width .5s}
.lifemeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* EVENT */
.ev h2{font-size:32px;font-weight:800;margin:8px 0 8px}
.ev p{margin:0;font-size:16.5px;color:#d8dfcf;max-width:58ch}
.choices{display:grid;gap:8px;margin-top:16px}
.choice{text-align:left;border-radius:11px;padding:14px 16px;background:var(--pitch);border:1px solid var(--line-2);font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.choice:hover:not([disabled]){border-color:var(--accent);background:rgba(255,122,43,.08)}
.choice[disabled]{opacity:.35;cursor:default}
.choice.picked{opacity:1;border-color:var(--accent);background:rgba(255,122,43,.14)}
.choice span.arrow{font-family:var(--f-mono);color:var(--accent)}
.outcome{margin-top:14px;padding:14px 16px;border-radius:11px;background:var(--panel-2);border-left:4px solid var(--accent)}
.outcome p{font-size:16px;margin:0 0 10px;color:var(--chalk)}
.suspense{display:flex;gap:6px;padding:18px 0 4px}
.suspense i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:blink 0.9s infinite}
.suspense i:nth-child(2){animation-delay:.15s}.suspense i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

/* REPORT */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--pitch);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-weight:900;font-size:36px;line-height:1;display:block}
.stat small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.lines{display:grid;gap:6px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--pitch);border:1px solid var(--line);font-size:14.5px}
.line .r{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
.line.win{border-color:rgba(242,196,67,.55);background:rgba(242,196,67,.08)}
.line.win .r{color:var(--gold);font-weight:600}
.trophies{display:flex;flex-wrap:wrap;gap:10px}
.troph{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:10px;background:rgba(242,196,67,.1);border:1px solid rgba(242,196,67,.45);color:var(--gold);font-weight:700;font-size:14px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.troph svg{width:30px;height:30px;flex:none}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 999px rgba(242,196,67,.55)}100%{box-shadow:inset 0 0 0 999px rgba(242,196,67,0)}}
.award{display:flex;gap:12px;align-items:center;padding:12px;border-radius:11px;background:var(--pitch);border:1px solid var(--line)}
.award.won{border-color:var(--gold);background:rgba(242,196,67,.08)}
.podium{display:grid;gap:4px;font-size:14px;margin-top:6px}
.podium div{display:flex;gap:8px}
.podium b{font-family:var(--f-mono);width:24px;color:var(--muted)}
.podium .me{color:var(--gold);font-weight:700}

/* OFFERS */
.offers{display:grid;gap:10px}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line-2)}
.offer:hover{border-color:var(--accent)}
.offer.stay{border-style:dashed}
.offer h3{font-size:22px;font-weight:800}
.offer .meta{font-size:13px;color:var(--muted)}
.offer .terms{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.role{font-family:var(--f-display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;border-radius:6px;text-align:center}
.role.Titular{background:var(--good);color:#0b2410}
.role.Rotação{background:var(--gold);color:#241a00}
.role.Reserva{background:var(--bad);color:#2a0704}
.role.Base{background:var(--blue);color:#06192a}

/* TABLE */
details.hist{background:var(--panel);border:1px solid var(--line);border-radius:14px}
details.hist summary{padding:14px 18px;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
details.hist summary::-webkit-details-marker{display:none}
.tbl{overflow-x:auto;padding:0 10px 12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:500}
th:nth-child(2),td:nth-child(2){text-align:left}
td.club{display:flex;align-items:center;gap:6px}
td .up{color:var(--good)} td .down{color:var(--bad)}

/* FINAL OVERLAY */
#overlay{position:fixed;inset:0;z-index:20;background:rgba(5,14,9,.92);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.final{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:22px;text-align:center}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:18px 0 8px}
.score .team{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;min-width:0}
.score .team span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .num{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:1;letter-spacing:.02em}
.clock{font-family:var(--f-mono);font-size:15px;color:var(--accent)}
.feed{min-height:96px;display:grid;gap:4px;margin:12px 0;font-size:14px;color:#d8dfcf;text-align:left}
.feed div{animation:pop .35s both}

/* END CARD */
.fut{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:3/4.1;border-radius:18px;padding:22px;background:linear-gradient(160deg,#2a5a3f 0%,#143424 55%,#0c2318 100%);border:2px solid var(--gold);display:flex;flex-direction:column;overflow:hidden}
.fut::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:2px solid rgba(242,196,67,.25);border-radius:50%}
.fut .top{display:flex;justify-content:space-between;align-items:flex-start}
.fut .big{font-family:var(--f-display);font-weight:900;font-size:76px;line-height:.8;color:var(--gold)}
.fut .pos{font-family:var(--f-display);font-weight:800;font-size:24px}
.fut .name{font-family:var(--f-display);font-weight:900;font-size:38px;text-transform:uppercase;margin-top:auto;line-height:.95;overflow-wrap:anywhere}
.fut .tier{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-top:6px}
.fut .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;border-top:1px solid rgba(242,196,67,.35);padding-top:12px}
.fut .nums b{font-family:var(--f-display);font-size:26px;font-weight:900;display:block;line-height:1}
.fut .nums small{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
.tierlist{display:grid;gap:3px}
.tierlist div{display:flex;gap:10px;padding:6px 10px;border-radius:7px;font-size:14px;color:var(--dim)}
.tierlist div.reached{color:var(--chalk)}
.tierlist div.me{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tierlist b{font-family:var(--f-mono);width:20px}
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cab{display:flex;gap:9px;align-items:center;padding:10px;border-radius:10px;background:var(--pitch);border:1px solid rgba(242,196,67,.3);min-width:0}
.cab svg{width:32px;height:32px;flex:none}
.cab b{font-family:var(--f-display);font-size:24px;color:var(--gold);line-height:1}
.cab small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.clubs{display:grid;gap:6px}
.clubrow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--pitch);border:1px solid var(--line)}
.clubrow .info{flex:1;min-width:0}
.clubrow .info b{display:block}
.clubrow .info span{font-size:12.5px;color:var(--muted)}
.idol{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;background:var(--gold);color:#241a00;padding:3px 6px;border-radius:4px}
.foot{font-size:12px;color:var(--dim);text-align:center}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.ev h2{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--pitch);border:1px solid var(--line);border-radius:11px}
.tab{flex:1 0 auto;border:0;background:transparent;padding:9px 12px;border-radius:8px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tab.on{background:var(--panel-2);color:var(--chalk)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{font-size:16px;padding:12px 10px}
.actions .btn.wide{grid-column:1/-1}
.res{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--pitch);border:1px solid var(--line)}
.res .wdl{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px}
.wdl.V{background:var(--good);color:#0b2410}.wdl.E{background:var(--gold);color:#241a00}.wdl.D{background:var(--bad);color:#2a0704}.wdl.X{background:var(--panel-2);color:var(--muted)}
.res .mid{min-width:0}
.res .mid small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .mid b{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;min-width:0;flex-wrap:wrap}
.res .mid b .sc{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.res .mine{font-family:var(--f-mono);font-size:12px;text-align:right;white-space:nowrap;color:var(--muted)}
.res .mine b{color:var(--chalk);font-size:15px;display:block}
.res.big{border-color:var(--line-2);background:var(--panel)}
.res.title{border-color:rgba(242,196,67,.6);background:rgba(242,196,67,.08)}
.mcard{display:grid;gap:10px}
.mscore{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.mscore .t{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700}
.mscore .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mscore .t.r{justify-content:flex-end;text-align:right}
.mscore .n{font-family:var(--f-display);font-weight:900;font-size:38px;line-height:1;white-space:nowrap}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:13px;color:#d8dfcf}
.scorers .a{text-align:right}
.scorers .me{color:var(--gold);font-weight:700}
.myline{display:flex;flex-wrap:wrap;gap:6px}
.std{width:100%;font-size:13px}
.std td,.std th{padding:6px 5px;text-align:right}
.std td:nth-child(2),.std th:nth-child(2){text-align:left}
.std tr.me td{background:rgba(255,122,43,.14);font-weight:700}
.std td.zone{width:4px;padding:0}
.zone.c{background:var(--accent)}.zone.s{background:var(--blue)}.zone.u{background:var(--good)}.zone.d{background:var(--bad)}
.legend-z{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend-z i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.compbox{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--pitch);border:1px solid var(--line)}
.comphead{display:flex;gap:10px;align-items:center}
.comphead svg{width:30px;height:30px;color:var(--gold);flex:none}
.comphead b{font-family:var(--f-display);font-size:20px;flex:1;min-width:0}
.status{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--panel-2)}
.status.win{background:var(--gold);color:#241a00}.status.out{color:var(--bad)}.status.live{color:var(--good)}
.plan{display:grid;gap:10px}
.behs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.beh{text-align:left;padding:12px;border-radius:10px;background:var(--pitch);border:1px solid var(--line-2)}
.beh b{display:block;font-family:var(--f-display);font-size:19px}
.beh span{font-size:13px;color:var(--muted)}
.beh.on{border-color:var(--accent);background:rgba(255,122,43,.1)}
.reqs{display:grid;gap:8px}
.req{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--pitch);border:1px solid var(--line)}
.req .lbl{flex:1;min-width:150px}
.req .lbl b{display:block}
.req .lbl span{font-size:12.5px;color:var(--muted)}
.req .out{width:100%;font-size:13.5px}
.goalwrap{width:100%;max-width:420px;margin:12px auto 0}
.goal{position:relative;width:100%;aspect-ratio:2.6/1;border:5px solid var(--chalk);border-bottom:0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(90deg,rgba(236,240,226,.08) 0 2px,transparent 2px 14px),repeating-linear-gradient(0deg,rgba(236,240,226,.08) 0 2px,transparent 2px 14px),#0e2a1c;overflow:hidden}
.goal .zones{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;z-index:3}
.goal .zones button{border:1px dashed rgba(236,240,226,.18);background:transparent;transition:background .15s}
.goal .zones button:hover:not([disabled]){background:rgba(255,122,43,.25)}
.goal .zones button[disabled]{cursor:default}
.keeper{position:absolute;left:50%;top:62%;width:16%;height:56%;transform:translate(-50%,-50%);transition:left .45s ease-out,top .45s ease-out,transform .45s;z-index:2}
.keeper i{position:absolute;inset:0;border-radius:40% 40% 20% 20%;background:var(--gold)}
.keeper i::before{content:"";position:absolute;left:50%;top:-22%;width:44%;aspect-ratio:1;border-radius:50%;background:var(--gold);transform:translateX(-50%)}
.ball{position:absolute;left:50%;top:118%;width:7%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25);transform:translate(-50%,-50%);transition:left .4s ease-in,top .4s ease-in,width .4s;z-index:4}
.grass{height:26px;background:linear-gradient(#1d5236,#163f2a);border-radius:0 0 8px 8px}
.pkres{font-family:var(--f-display);font-weight:900;font-size:34px;text-align:center;margin-top:10px;min-height:40px}
.tally{display:grid;gap:6px;margin-top:10px}
.tally div{display:flex;gap:8px;align-items:center;font-size:14px}
.tally span.k{display:flex;gap:4px}
.tally i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);display:inline-block}
.tally i.g{background:var(--good);border-color:var(--good)}.tally i.m{background:var(--bad);border-color:var(--bad)}
.ovwrap{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:20px;text-align:center;max-height:100%;overflow:auto}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px}
.news{display:flex;gap:12px;align-items:center;padding:12px;border-radius:11px;background:rgba(242,196,67,.08);border:1px solid rgba(242,196,67,.5)}
.news svg{width:34px;height:34px;color:var(--gold);flex:none}

/* ---------- Polimento: estádio à noite ---------- */
body{background:radial-gradient(1200px 520px at 8% -6%,rgba(255,236,190,.10),transparent 60%),radial-gradient(1200px 520px at 92% -6%,rgba(255,236,190,.08),transparent 60%),repeating-linear-gradient(180deg,var(--pitch) 0 72px,var(--pitch-2) 72px 144px);background-attachment:fixed}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--panel);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px -18px rgba(0,0,0,.8)}
.btn{background:linear-gradient(180deg,#ff9248,var(--accent));box-shadow:0 8px 22px -10px rgba(255,122,43,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:rgba(255,255,255,.02);box-shadow:none}
.btn.big{font-size:22px;padding:15px 26px}
.h2{font-size:42px;font-weight:900;margin-top:6px}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(9,27,18,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topnav-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{border:0;background:transparent;font-family:var(--f-display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:20px;line-height:.85;display:flex;flex-direction:column;align-items:flex-start;padding:0}
.brand span:last-child{color:var(--accent)}
.navtabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
.navtab{border:0;background:transparent;padding:8px 10px;border-radius:9px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.navtab.on{color:var(--chalk);background:var(--panel-2)}
.navtab .av{width:20px;height:20px;border-radius:50%}
.menu{border:1px solid var(--line-2);background:transparent;border-radius:9px;width:38px;height:38px;font-size:18px;flex:none}
.hero{padding:40px 24px 28px;background:radial-gradient(circle at 50% 120%,rgba(255,122,43,.22),transparent 60%),linear-gradient(180deg,#184a32,#0f2f20)}
.hero .floods{position:absolute;inset:0;pointer-events:none;z-index:0}
.hero .floods i{position:absolute;top:-40%;width:60%;height:140%;background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,240,205,.16) 180deg,transparent 200deg);animation:sweep 9s ease-in-out infinite alternate}
.hero .floods i:first-child{left:-18%;transform-origin:50% 0;rotate:-14deg}
.hero .floods i:last-child{right:-18%;transform-origin:50% 0;rotate:14deg;animation-delay:-4s}
@keyframes sweep{from{opacity:.55;translate:-4% 0}to{opacity:1;translate:4% 0}}
.logo{margin-top:12px;display:flex;flex-direction:column}
.logo .l1{color:var(--chalk)}
.logo .l2{color:transparent;-webkit-text-stroke:2px var(--accent);text-shadow:0 0 40px rgba(255,122,43,.35)}
.lede{max-width:48ch;color:#cfdbcc;font-size:16.5px;margin:16px 0 22px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px;border-top:1px solid var(--line-2);padding-top:14px}
.strip b{font-family:var(--f-display);font-weight:900;font-size:30px;display:block;line-height:1}
.strip span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.how .num{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.12em;display:block;margin-bottom:6px}
.shield.img{clip-path:none;background:transparent}
.shield.img img{width:100%;height:100%;object-fit:contain}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.clubrow{flex-wrap:wrap}
.account{display:flex;gap:14px;align-items:center}
.avbig{width:64px;height:64px;border-radius:50%;flex:none;border:2px solid var(--gold)}
.codebox{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;border-radius:12px;background:var(--pitch);border:1px dashed var(--gold)}
.codebox b{font-size:14px;word-break:break-all;color:var(--gold)}
.rank{display:grid;gap:6px}
.rankrow{display:grid;grid-template-columns:28px 30px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:11px;background:var(--pitch);border:1px solid var(--line)}
.rankrow:hover{border-color:var(--accent)}
.rankrow .pos-n{color:var(--muted);font-size:14px}
.rankrow .info{min-width:0}.rankrow .info b{display:block}.rankrow .info span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tierdot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;background:var(--panel-2)}
.tierdot.t7,.tierdot.t8{background:var(--accent);color:var(--accent-ink)}.tierdot.t9,.tierdot.t10{background:var(--gold);color:#241a00}
.endhero{display:grid;gap:18px}
.endtitle{text-align:center}.endtitle h2{font-size:48px;font-weight:900;margin-top:8px;color:var(--accent)}
.fut{background:linear-gradient(150deg,#e8c25b 0%,#b48a26 18%,#2a5a3f 19%,#143424 60%,#0c2318 100%);box-shadow:0 30px 60px -30px rgba(242,196,67,.6)}
.fut .shine{position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.ph .who b{font-size:21px}
@media (max-width:480px){.navtab{padding:8px 7px;font-size:13.5px}.brand{font-size:17px}.strip b{font-size:24px}.h2{font-size:34px}}
@media (max-width:440px){.brand{display:none}.navtabs{margin-left:0;width:100%;justify-content:space-between}.navtab{font-size:14px;padding:8px 8px}}

.divider{height:1px;background:var(--line);margin:6px 0}

/* ---------- pênaltis ---------- */
.ovwrap.pk{padding:16px}
.pkh{font-size:28px;font-weight:900;margin-top:4px}
.scenebox{margin:10px auto 0;width:100%;max-width:460px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:#07140d}
.pkscene{display:block;width:100%;height:auto}
.zdot{cursor:pointer;outline:none}
.zdot .ring{fill:rgba(255,122,43,.18);stroke:var(--accent);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:zpulse 1.4s ease-in-out infinite}
.zdot .core{fill:var(--accent)}
.zdot.save .ring{fill:rgba(124,196,255,.18);stroke:var(--blue)}.zdot.save .core{fill:var(--blue)}
.zdot:hover .ring,.zdot:focus-visible .ring{fill:rgba(255,122,43,.45);stroke-width:2.6}
.zdot.save:hover .ring,.zdot.save:focus-visible .ring{fill:rgba(124,196,255,.45)}
@keyframes zpulse{0%,100%{transform:scale(.85);opacity:.8}50%{transform:scale(1.15);opacity:1}}
#kp .idle{animation:kbob 1.1s ease-in-out infinite}
@keyframes kbob{0%,100%{transform:translateY(0)}50%{transform:translateY(1.6px)}}
.pkres{font-family:var(--f-display);font-weight:900;font-size:40px;text-align:center;margin-top:8px;min-height:44px;letter-spacing:.02em}
.pkres .good{color:var(--good)}.pkres .bad{color:var(--bad)}
.pkmsg{display:grid;gap:2px;margin-top:10px;font-size:15px}
.order{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:440px){.order{grid-template-columns:repeat(3,1fr)}}
.ordbtn{display:flex;flex-direction:column;gap:2px;align-items:center;padding:12px 6px;border-radius:12px;background:var(--pitch);border:1px solid var(--line-2)}
.ordbtn b{font-family:var(--f-display);font-size:30px;font-weight:900;color:var(--accent);line-height:1}
.ordbtn span{font-size:11.5px;color:var(--muted);line-height:1.2}
.ordbtn:hover{border-color:var(--accent);background:rgba(255,122,43,.1)}
.tally div{font-size:15px}
.tally i{width:16px;height:16px}

/* ---------- ao vivo ---------- */
.ovwrap.live{text-align:center}
.livetag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--bad);font-weight:600}
.livetag i{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
.clockbar{height:4px;border-radius:2px;background:var(--pitch);overflow:hidden;margin-top:6px}
.clockbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .1s linear}
.clock{font-size:20px;margin-top:6px}
.lmsg{min-height:20px;color:var(--gold);font-weight:600;font-size:14px}
.live-feed{text-align:left;min-height:180px;align-content:start}
.fl{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;background:var(--pitch);border:1px solid var(--line);font-size:14px}
.fl b{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:28px}
.fl.gl{border-color:rgba(166,227,154,.5);font-weight:700}
.fl.gl.th{border-color:rgba(255,106,92,.45)}
.fl.me{border-color:rgba(242,196,67,.6);background:rgba(242,196,67,.07)}
.fl.bad{color:#ffb3aa}
.fl.ht{justify-content:center;color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.lfin{font-size:32px;font-weight:900;margin:8px 0 12px}.lfin.good{color:var(--gold)}.lfin.bad{color:var(--bad)}
.goalflash{animation:gflash .9s ease-out}
.goalflash.bad{animation:gflashb .9s ease-out}
@keyframes gflash{0%{box-shadow:inset 0 0 0 999px rgba(166,227,154,.28)}100%{box-shadow:inset 0 0 0 999px rgba(166,227,154,0)}}
@keyframes gflashb{0%{box-shadow:inset 0 0 0 999px rgba(255,106,92,.22)}100%{box-shadow:inset 0 0 0 999px rgba(255,106,92,0)}}
.speed{margin-top:10px}.speed .tab{flex:0 0 auto;font-size:14px;padding:7px 12px;background:var(--pitch);border:1px solid var(--line)}
.livemode{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lmbtn{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.lmbtn.on{background:var(--chalk);color:var(--pitch);border-color:var(--chalk)}

/* ---------- troféus, celebração, cerimônia ---------- */
.cab svg,.miniTro svg{width:30px;height:42px;flex:none}
.miniTro{display:inline-flex}
.troph svg{width:26px;height:36px}
.award svg{width:34px;height:46px}
.ovwrap.celeb,.ovwrap.cer{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1e4a33,#0d2318 70%)}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.rays{position:absolute;left:50%;top:32%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(242,196,67,.10) 0 8deg,transparent 8deg 22deg);animation:spin 26s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.celeb>*,.cer>*{position:relative;z-index:1}
.tro-stage{position:relative;height:230px;display:grid;place-items:end center;margin-top:6px}
.tro{width:150px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(242,196,67,.35))}
.tro.small{width:96px;margin:0 auto}

.tro.rise{animation:trorise 1.1s cubic-bezier(.2,1.4,.4,1) both,trofloat 3s ease-in-out 1.1s infinite}
@keyframes trorise{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes trofloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.plinth{position:absolute;bottom:-6px;width:180px;height:16px;border-radius:50%;background:radial-gradient(rgba(242,196,67,.45),transparent 70%)}
.champ{font-size:48px;font-weight:900;color:var(--gold);letter-spacing:.02em;text-shadow:0 0 30px rgba(242,196,67,.45);margin:10px 0 2px;animation:pop .6s .5s cubic-bezier(.2,1.6,.4,1) both}
.cname{font-family:var(--f-display);font-weight:800;font-size:22px}
.spot{position:absolute;left:50%;top:-30%;width:420px;height:420px;margin-left:-210px;background:radial-gradient(rgba(255,245,215,.16),transparent 65%);pointer-events:none}
.noms{display:grid;gap:8px;margin-top:14px}
.nom{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--pitch);border:1px solid var(--line-2);text-align:left;transition:opacity .4s,transform .4s,border-color .4s}
.nom.me{border-color:rgba(255,122,43,.6)}
.nomtxt{min-width:0}.nomtxt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nomtxt span{font-size:12.5px;color:var(--muted)}
.nom.big{padding:14px;border-color:var(--gold);background:rgba(242,196,67,.1);justify-content:center}
.nomwrap.lose{opacity:.35;transform:scale(.97)}
.nomwrap.win .nom{border-color:var(--gold);background:rgba(242,196,67,.12);transform:scale(1.03)}
.reveal{min-height:60px;margin-top:12px;display:grid;gap:8px;justify-items:center}
.drum{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--gold);animation:blink 1.2s infinite}
.winner{display:grid;gap:10px;justify-items:center;width:100%}
.rank10{display:grid;gap:5px;margin-top:12px;text-align:left}
.r10row{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;animation:pop .35s both}
.r10row b{color:var(--muted)}
.r10row.podium b{color:var(--gold);font-size:16px}
.r10row.me .nom{border-color:var(--accent);background:rgba(255,122,43,.12)}
#overlay{overflow:auto;align-items:start}
#overlay>.ovwrap{margin:auto}
@media (prefers-reduced-motion:reduce){.rays,.tro.rise,.zdot .ring,#kp .idle{animation:none!important}}

.r10row{grid-template-columns:34px 1fr auto;padding:7px 10px;border-radius:9px;background:var(--pitch);border:1px solid var(--line);font-size:14px}
.r10n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r10c{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

 for(const l in CLUB_SRC)for(const row of CLUB_SRC[l].split(';')){const[n,s,c1,c2,uf]=row.split('|');const c={id:n,n,s:+s,base:+s,l,c1,c2,uf:uf||null,a:mkAbbr(n),country:LG[l].c};CLUBS.push(c);CLUB[n]=c}
 for(const conf in EXT_SRC)for(const row of EXT_SRC[conf].split(';')){const[n,s,c1,c2]=row.split('|');CLUB[n]={id:n,n,s:+s,base:+s,l:null,ext:conf,c1,c2,a:mkAbbr(n)}}
}

}
function roster(id){
 const real=W.stars.filter(s=>s.club===id).map(s=>({n:s.n,pos:s.pos}));
 const rr=seeded(hash(id+'#'));const fakePos=['ATA','PE','PD','SA','MEI','MC','VOL','ZAG','LE','LD','ME','MD','ATA'];
 const fakes=fakePos.map(p=>({n:fakeName(rr),pos:p}));
 return real.concat(fakes);
}
function natRoster(code){
 const real=W.stars.filter(s=>s.nat===code).map(s=>({n:s.n,pos:s.pos}));
 const rr=seeded(hash(code+'@'));return real.concat(['ATA','PE','PD','SA','MEI','MC','ATA'].map(p=>({n:fakeName(rr),pos:p})));
}

const FX_NAME={ovr:'OVR',cab:'Cabeça',corpo:'Corpo',disc:'Disciplina',fama:'Fama',forma:'Forma',board:'Diretoria'};
function applyFx(fx){
 const chips=[];if(!fx)return chips;const st=S.st;
 for(const k of['ovr','forma','cab','corpo','disc','fama','board']){
  if(!fx[k])continue;const v=Math.round(fx[k]);
  if(k==='ovr'){S.ovr=clamp(S.ovr+v,30,99);if(S.ovr>S.peak){S.peak=S.ovr;S.peakAge=S.age}}
  else if(k==='forma'){if(st)st.forma+=v}
  else if(k==='board'){S.board=clamp(S.board+v,0,100)}
  else S.life[k]=clamp(S.life[k]+v,0,100);
  chips.push([`${v>0?'+':'−'}${Math.abs(v)} ${FX_NAME[k]}`,v>0?'up':'down']);
 }
 if(fx.pot){S.pot=clamp(S.pot+fx.pot,40,99);chips.push([fx.pot>0?'↑ Potencial':'↓ Potencial',fx.pot>0?'up':'down'])}
 if(fx.din){S.din=Math.max(0,S.din+fx.din);chips.push([`${fx.din>0?'+':'−'}${money(fx.din)}`,fx.din>0?'up':'down'])}
 if(fx.inj&&st){const m=Math.max(1,Math.round(fx.inj*40));st.injLeft+=m;chips.push([`Lesão: fora ${m} jogos`,'down'])}
 if(fx.susp&&st){st.suspLeft+=fx.susp;chips.push([`Suspenso ${fx.susp} jogos`,'down'])}
 if(fx.lang&&!S.langs.includes(fx.lang)){S.langs.push(fx.lang);chips.push([`Fala ${LANG_NAME[fx.lang]}`,'up'])}
 if(fx.rel){S.rel=fx.rel;chips.push([fx.rel==='casado'?'Casado':fx.rel==='namorando'?'Namorando':'Solteiro',''])}
 if(fx.filho){S.filhos++;chips.push([S.filhos===1?'Primeiro filho':`${S.filhos}º filho`,'up'])}
 if(fx.agent){S.agent=fx.agent;S.agentUses=fx.agent==='tubarao'?4:fx.agent==='pai'?2:3;chips.push([fx.agent==='tubarao'?'Empresário tubarão':fx.agent==='pai'?'Pai empresário':'Agência séria',''])}
 if(fx.pos){const old=fit(S.attrs,S.pos),nw=fit(S.attrs,fx.pos);S.pos=fx.pos;S.pot=clamp(S.pot+(nw-old),40,99);S.ovr=clamp(S.ovr+Math.round((nw-old)*.6)-1,30,99);chips.push([`Agora é ${POS[fx.pos].n}`,'gold'])}
 if(fx.window){S.flags.window=true;chips.push(['Janela de transferência aberta','gold'])}
 if(fx.release){S.flags.release=true;chips.push(['Clube quer te negociar','down'])}
 if(fx.scout){S.flags.scout=true;chips.push(['Olheiros de olho','gold'])}
 if(fx.risk&&st){st.injRisk+=fx.risk}
 return chips;
}

function kickOutcome(zone,dive,skill,press=0){
 const top=zone<3,col=zone%3,dcol=dive%3,dtop=dive<3;
 const miss=clamp((top?(col===1?.07:.17):(col===1?.02:.07))-(skill-75)/260+press,.01,.35);
 if(ch(miss))return'fora';
 if(col===dcol){const save=col===1?(dtop===top?.8:.55):(top===dtop?.72:(top?.25:.5));return ch(save)?'defesa':'gol'}
 return'gol';
}
const aiDive=()=>wpick([0,1,2,3,4,5],z=>[.15,.06,.15,.27,.1,.27][z]);

function gkSave(zone,dive){ // jogador é goleiro
 const top=zone<3,col=zone%3,dcol=dive%3,dtop=dive<3;

 if(col!==dcol)return'gol';

function autoShootout(o){

 let a=0,b=0;const log=[];const pu=clamp(.74+(o.usS-o.themS)/120,.6,.86),pt=clamp(.74+(o.themS-o.usS)/120,.6,.86);
 for(let i=0;i<5;i++){
  let g=ch(pu);if(o.iAmIn&&!o.isGK&&i===o.myIdx)g=kickOutcome(aiShot(),aiDive(),CA().FIN)==='gol';
  a+=g;log.push([1,g]);
  let h=ch(pt);if(o.iAmIn&&o.isGK)h=gkSave(aiShot(),aiDive())==='gol';

function roundRobin(ids){
 const t=ids.slice();if(t.length%2)t.push(null);const n=t.length;const rounds=[];
 for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)pr.push(r%2?[b,a]:[a,b])}rounds.push(pr);t.splice(1,0,t.pop())}
 return rounds.concat(rounds.map(r=>r.map(([a,b])=>[b,a])));
}

async function stepSeason(io,mode){

  const it=st.cal[st.idx];
  if(it.k==='ev'){
   const ev=pickEvents(it.when);st.idx++;
   if(!ev)continue;
   if(mode==='auto'||mode==='sim'){const r=await io.event(ev);st.evlog.push({t:ev.t,txt:r.txt});continue}

  }

function addYouthToSeason(st,me,pre,items){
 const C=COUNTRY[me.country];const Y=YOUTH_NAMES[me.country]||{lg:'Liga Sub-20',cup:'Copa Sub-20'};
 const pool=countryClubs(me.country).filter(x=>x.id!==me.id).sort((a,b)=>b.s-a.s).slice(0,24).map(x=>x.id);
 const teams=[me.id,...shuffle(pool).slice(0,8)];
 // turno único, 9 times (método do círculo com folga)
 const sl=[...teams,null];const RR=[];
 for(let r=0;r<9;r++){const fx=[];for(let i=0;i<5;i++){const a=sl[i],b=sl[9-i];if(a&&b)fx.push(r%2?[b,a]:[a,b])}RR.push(fx);sl.splice(1,0,sl.pop())}
 RR.push(...RR.map(fx=>fx.map(([a,b])=>[b,a])));
 const myR=[],opps=[],homes=[];let bye=[];
 RR.forEach((fx,r)=>{const m=fx.find(f=>f.includes(me.id));if(!m){bye.push(r);return}myR.push(r);opps.push(m[0]===me.id?m[1]:m[0]);homes.push(m[0]===me.id)});

 st.comps.yc={id:'yc',n:cupN,ic:me.country==='BRA'?'copa':'cont3',t:'base',kind:'ko',youth:true,pool:cpool,stage:0,alive:true,path:[],rounds:rounds.map(n=>({n,legs:1,neutral:n==='Final'}))};

async function processYouth(it,io){
 const st=S.st;const me=club();
 if(it.k==='yl'){
  const comp=st.comps.yl;const oid=comp.opps[it.i];const us=youthSide(me.id),them=youthSide(oid);const home=comp.homes?comp.homes[it.i]:it.i%2===0;
  const r=await playMine({us,them,home,comp:comp.n,label:`${it.i+1}ª rodada`,youthS:us.s,live:wantLive('grp')},io);if(r.live)await r.live.finish({msg:'Fim de jogo.'});
  record('Base',r.me);comp.pts+=r.gu>r.gt?3:r.gu===r.gt?1:0;comp.gp+=r.gu;comp.gc+=r.gt;
  const res=mkRes(comp.n,`${it.i+1}ª rodada`,home?me.id:oid,home?oid:me.id,home?r.gu:r.gt,home?r.gt:r.gu,r,home,null,'yl',home?us:them,home?them:us);comp.path.push(res);
  let rank;

   const sim=ri=>{for(const[a,b]of comp.RR[ri]){if(a===me.id||b===me.id)continue;const[g1,g2]=quickScore(youthStr(a),youthStr(b));tabAdd(comp.gtab,a,b,g1,g2)}};
   sim(comp.myR[it.i]);if(it.i===0){if(Array.isArray(comp.bye))comp.bye.forEach(sim);else if(comp.bye>=0)sim(comp.bye)}
   rank=sortTable(comp.gtab).findIndex(x=>x.id===me.id)+1;
  }
  if(it.i===comp.opps.length-1){
   if(!rank){const others=comp.opps.map(id=>Math.round(8*(1.1+(CLUB[id].s-me.s)/30)+R(-4,4)+R(3,6)));rank=1+others.filter(p=>p>comp.pts||(p===comp.pts&&ch(.5))).length}
   comp.rank=rank;

   else res.note=`${rank}º lugar · ${comp.n} (${comp.pts} pts)`;comp.alive=false;
  }else if(rank)res.note=`${rank}º na tabela · ${comp.n}`;
  return res;
 }
 if(it.k==='debut'){
  if(S.flags.debuted||!S.youth)return null;
  const b=st.stats.Base;const n=b&&b.nn?b.ns/b.nn:6.5;

  return{k:'info',comp:'Profissional',txt:'O técnico do profissional observou seus jogos na base, mas ainda não te chamou.'};
 }
 return null;
}
function youthPromotion(st,me){

const DR={};
function startDraft(){DR.attrs={};DR.round=0;DR.re=DIFF[CR.diff].re;DR.bag=LEGENDS.map((_,i)=>i);drawLegend();renderDraft()}
function drawLegend(){
 const wOf=i=>{const p=LEGENDS[i][2];if(p===CR.pos)return CR.pos==='GOL'?7:3;if(NEIGH[CR.pos].includes(p))return 1.8;return 1};
 const i=wpick(DR.bag,wOf);DR.bag=DR.bag.filter(x=>x!==i);const L=LEGENDS[i];const pen=CR.diff==='lenda'?-3:CR.diff==='amador'?1:0;
 DR.leg={n:L[0],f:L[1],pos:L[2],ovr:L[3],vals:Object.fromEntries(ATTRS.map((k,j)=>[k,clamp(L[4][j]+RI(-2,1)+pen,10,99)]))};
}
function renderDraft(){
 const w=POS[CR.pos].w;const cur={...DR.attrs};ATTRS.forEach(k=>{if(cur[k]==null)cur[k]=50});
 const L=DR.leg;
 $app.innerHTML=`<div class="wrap">
 <div class="phead"><h2>Roube dos Ícones</h2><p>Cada Ícone oferece um atributo. Toque num quadro laranja para pegar. Quanto maior o <b>peso</b>, mais ele importa para ${esc(POS[CR.pos].n.toLowerCase())}.</p>
 <div class="rounds">${Array.from({length:8},(_,i)=>`<i class="${i<DR.round?'done':i===DR.round?'on':''}"></i>`).join('')}<span>Roubo ${DR.round+1} de 8</span></div></div>

 <div class="slots">${ATTRS.map(k=>{const f=DR.attrs[k]!=null;const wt=w[k]||0;return`<button class="slot ${f?'filled':'take'} ${!wt?'useless':''}" data-a="${k}" ${f?'disabled':''}><span class="k">${k}</span><span class="v mono">${f?DR.attrs[k]:L.vals[k]}</span><span class="w">${ATTR_NAME[k]} · ${wt?`peso ${Math.round(wt*100)}%`:'não conta'}</span></button>`}).join('')}</div>
 <section class="card potbar"><div><div class="eyebrow">Encaixe atual</div><div class="potnum mono">${fit(cur,CR.pos)}</div><div class="muted" style="font-size:12px">vazios contam como 50</div></div>

 $app.querySelectorAll('.slot.take').forEach(b=>b.onclick=()=>{DR.attrs[b.dataset.a]=L.vals[b.dataset.a];DR.round++;if(DR.round>=8)finishDraft();else{drawLegend();renderDraft()}});
 document.getElementById('re').onclick=()=>{if(DR.re<=0)return;DR.re--;drawLegend();renderDraft()};

function matchCard(r){
 if(r.k!=='match')return resRow(r,true);
 const m=r.me;const hs=r.scorers.filter(s=>s.side==='h'),as=r.scorers.filter(s=>s.side==='a');const rows=Math.max(hs.length,as.length);
 let sc='';for(let i=0;i<rows;i++){const a=hs[i],b=as[i];sc+=`<div class="${a&&a.w.startsWith(S.name)?'me':''}">${a?`${a.m}' ${esc(a.w)}`:''}</div><div class="a ${b&&b.w.startsWith(S.name)?'me':''}">${b?`${esc(b.w)} ${b.m}'`:''}</div>`}
 const chips=[];if(m.play){chips.push([`${m.min} min`,'']);if(m.g)chips.push([`${m.g} gol${m.g>1?'s':''}`,'up']);if(m.a)chips.push([`${m.a} assist.`,'up']);if(m.cs)chips.push(['Sem sofrer gol','up']);if(m.nota!=null)chips.push([`Nota ${fmt1(m.nota)}`,m.nota>=7.5?'up':m.nota<6?'down':'']);if(m.pen)chips.push([`Pênalti ${m.pen}`,m.pen==='convertido'||m.pen==='defendeu pênalti'?'up':'down']);if(m.fk)chips.push(['Gol de falta','gold']);if(m.y)chips.push(['Amarelo','down']);if(m.r)chips.push(['Expulso','down']);if(m.inj)chips.push([`Lesão: ${m.inj} jogos fora`,'down'])}else chips.push([m.why==='lesionado'?'Fora: lesionado':m.why==='suspenso'?'Fora: suspenso':m.why==='base'?'Jogando na base':'Não saiu do banco','']);
 return`<section class="card mcard ${r.final&&r.koWin?'flash':''}"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(r.comp)} · ${esc(r.label)}</span><span class="wdl ${r.wdl}" style="width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900">${r.wdl}</span></div>
 <div class="mscore"><div class="t">${shieldHTML(r.home)}<span>${esc(r.home.n)}</span></div><div class="n mono">${r.hg}–${r.ag}</div><div class="t r"><span>${esc(r.away.n)}</span>${shieldHTML(r.away)}</div></div>
 ${r.pens?`<div style="text-align:center" class="mono muted">Pênaltis ${r.pens[0]}–${r.pens[1]}</div>`:''}${r.agg?`<div style="text-align:center" class="mono muted">Agregado ${r.agg[0]}–${r.agg[1]}</div>`:''}
 ${sc?`<div class="scorers">${sc}</div>`:''}
 <div class="myline">${chips.map(([t,k])=>`<span class="chip ${k}">${esc(t)}</span>`).join('')}</div>
 ${r.note?`<div class="line ${r.koWin?'win':''}"><span>${esc(r.note)}</span><span class="r">${r.koWin&&r.final?'🏆':''}</span></div>`:''}</section>`;
}

async function advance(mode){
 if(BUSY)return;BUSY=true;
 const io=mode==='auto'||mode==='skip'||mode==='block'?IO_AUTO:IO_UI;
 try{
  const r=await stepSeason(io,mode==='auto'?'auto':mode==='block'?'block':mode==='one'||mode==='skip'?'one':'decision');
  LASTR=r.results;
  if(r.pause){PAUSE=r.pause.ev;PAUSE._d=PAUSE.d();EVRES=null}
 }catch(e){console.error(e)}
 BUSY=false;renderHub();saveNow('season');
}

const ZPOS=[[17,30],[50,30],[83,30],[17,70],[50,70],[83,70]];
function goalHTML(){return`<div class="goalwrap"><div class="goal"><div class="keeper" id="kp"><i></i></div><div class="ball" id="ball"></div><div class="zones">${[0,1,2,3,4,5].map(z=>`<button data-z="${z}" aria-label="Zona ${z+1}"></button>`).join('')}</div></div><div class="grass"></div></div>`}
function waitZone(){return new Promise(res=>{$ov.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{$ov.querySelectorAll('[data-z]').forEach(x=>x.disabled=true);res(+b.dataset.z)})})}
async function animKick(shot,dive,res){
 const kp=document.getElementById('kp'),ball=document.getElementById('ball');
 const[dx,dy]=ZPOS[dive];kp.style.left=dx+'%';kp.style.top=(dy+(dive<3?5:0))+'%';kp.style.transform=`translate(-50%,-50%) rotate(${dive%3===0?-35:dive%3===2?35:0}deg)`;
 let[bx,by]=ZPOS[shot];if(res==='fora'){by=shot<3?-12:by;bx=shot%3===0?-6:shot%3===2?106:bx}
 ball.style.left=bx+'%';ball.style.top=by+'%';ball.style.width='5%';
 await sleep(650);
}
const IO_UI={
 async penalty(o){
  return new Promise(async resolve=>{
   $ov.hidden=false;const save=o.mode==='save';
   $ov.innerHTML=`<div class="ovwrap"><div class="eyebrow">${esc(o.comp)} · ${o.min}'</div><h2 style="font-size:30px;font-weight:900;margin-top:4px">${save?`Pênalti contra! Você no gol`:`Pênalti! A bola é sua`}</h2><p class="muted" style="margin:6px 0 0">${save?'Toque onde você vai pular.':'Toque onde você vai bater. Cantos altos são indefensáveis, mas é fácil isolar.'}</p>${goalHTML()}<div class="pkres" id="pkr"></div><div id="pkc"></div></div>`;
   const z=await waitZone();let shot,dive,res;
   if(save){dive=z;shot=aiShot();res=gkSave(shot,dive)}else{shot=z;dive=aiDive();res=kickOutcome(shot,dive,S.attrs.FIN,(55-S.life.cab)/400)}
   await animKick(shot,dive,res);
   const good=save?res!=='gol':res==='gol';
   document.getElementById('pkr').innerHTML=`<span style="color:${good?'var(--good)':'var(--bad)'}">${res==='gol'?'GOL!':res==='defesa'?(save?'DEFENDEU!':'O goleiro pegou'):(save?'Pra fora!':'Isolou')}</span>`;
   document.getElementById('pkc').innerHTML='<button class="btn wide" id="pkok" style="margin-top:12px">Continuar</button>';
   document.getElementById('pkok').onclick=()=>{$ov.hidden=true;$ov.innerHTML='';resolve({goal:res==='gol',res})};
  });
 },
 async shootout(o){
  return new Promise(async resolve=>{
   $ov.hidden=false;
   const pu=clamp(.74+(o.usS-o.themS)/120,.6,.86),pt=clamp(.74+(o.themS-o.usS)/120,.6,.86);
   const ku=[],kt=[];let a=0,b=0;
   const draw=(msg,showGoal)=>{$ov.innerHTML=`<div class="ovwrap"><div class="eyebrow">${esc(o.comp)} · ${esc(o.round)}</div><h2 style="font-size:28px;font-weight:900;margin-top:4px">Disputa de pênaltis</h2>
    <div class="tally"><div>${shieldHTML(o.us,'sm')}<b style="flex:1;text-align:left">${esc(o.us.n)}</b><span class="k">${ku.map(g=>`<i class="${g?'g':'m'}"></i>`).join('')}</span><b class="mono">${a}</b></div><div>${shieldHTML(o.them,'sm')}<b style="flex:1;text-align:left">${esc(o.them.n)}</b><span class="k">${kt.map(g=>`<i class="${g?'g':'m'}"></i>`).join('')}</span><b class="mono">${b}</b></div></div>
    <p class="muted" style="margin:10px 0 0">${msg}</p>${showGoal?goalHTML():''}<div class="pkres" id="pkr"></div><div id="pkc"></div></div>`};
   const early=()=>{const ru=Math.max(0,5-ku.length),rt=Math.max(0,5-kt.length);return a>b+rt||b>a+ru};
   for(let r=0;r<30;r++){
    let g;
    if(o.iAmIn&&!o.isGK&&r===o.myIdx){draw('Sua vez de bater. Escolha o canto.',true);const z=await waitZone();const dive=aiDive();const res=kickOutcome(z,dive,S.attrs.FIN,(55-S.life.cab)/300);await animKick(z,dive,res);g=res==='gol';document.getElementById('pkr').innerHTML=`<span style="color:${g?'var(--good)':'var(--bad)'}">${g?'GOL!':res==='defesa'?'Defendeu':'Pra fora'}</span>`;await sleep(900)}
    else{g=ch(pu);draw(`${esc(o.us.n)} cobra…`,false);await sleep(420)}
    ku.push(g);a+=g;if(r<5&&early())break;
    let h;
    if(o.iAmIn&&o.isGK){draw('Você no gol. Escolha pra onde pular.',true);const z=await waitZone();const shot=aiShot();const res=gkSave(shot,z);await animKick(shot,z,res);h=res==='gol';document.getElementById('pkr').innerHTML=`<span style="color:${!h?'var(--good)':'var(--bad)'}">${h?'Gol deles':res==='defesa'?'DEFENDEU!':'Pra fora!'}</span>`;await sleep(900)}
    else{h=ch(pt);draw(`${esc(o.them.n)} cobra…`,false);await sleep(420)}
    kt.push(h);b+=h;
    if(r<5){if(early())break;if(r===4&&a!==b)break}else if(a!==b)break;
   }
   if(a===b)a++;
   const win=a>b;
   draw(win?'Vocês venceram nos pênaltis!':'Eliminados nos pênaltis.',false);
   document.getElementById('pkr').innerHTML=`<span style="color:${win?'var(--good)':'var(--bad)'}">${a}–${b}</span>`;
   document.getElementById('pkc').innerHTML='<button class="btn wide" id="pkok" style="margin-top:12px">Continuar</button>';
   document.getElementById('pkok').onclick=()=>{$ov.hidden=true;$ov.innerHTML='';resolve({win,a,b})};
  });
 },
 async event(ev){return resolveOption(ev,autoOption(ev))},
};

let OFFERS=[];
function afterSeason(){
 const r=mustRetire();if(r){S.retiredReason=r;return renderEnd()}
 S.agentUses=AGENT_QUOTA[S.agent]||3;
 if(S.agreed&&CLUB[S.agreed.club]){const o=S.agreed,from=S.club;S.agreed=null;if(S.loan)endLoan();acceptOffer(o);return renderAgreedMove(o,from)}
 const w=windowState();
 if(w.forced==='loanEnd'){const lc=S.club,ls=S.lastSeason;const good=ls&&ls.nota>=7&&S.ovr>=CLUB[lc].s-3;endLoan();return renderOffers({stay:true,loanBack:true,buyFrom:good?lc:null})}
 if(!w.open){if(S.age>=32)return renderOffers({stay:true,quiet:true});return startPreseason()}
 renderOffers(w);
}
function renderOffers(w,leagueFilter){
 const c=club();
 OFFERS=w.quiet?[]:genOffers(leagueFilter);
 const canStay=w.stay||w.renew||w.loanBack;if(w.buyFrom&&CLUB[w.buyFrom]){OFFERS=OFFERS.filter(o=>o.club!==w.buyFrom);OFFERS.unshift({...mkOffer(CLUB[w.buyFrom]),buy:true})}if(canStay)OFFERS.unshift(stayOffer());OFFERS=OFFERS.slice(0,3);
 const title=w.quiet?'Fim de temporada':w.loanBack?`De volta ao ${c.n}`:w.release?'O clube quer te negociar':S.contract<=0?'Seu contrato acabou':'Janela de transferências';
 const sub=w.quiet?'Nenhuma proposta chegou. Você pode seguir ou pendurar as chuteiras.':w.release?`O ${c.n} não conta mais com você.`:S.contract<=0&&!w.renew?`O ${c.n} não vai renovar.`:leagueFilter?`Seu empresário ligou pra clubes da ${LG[leagueFilter].n}.`:'Propostas na mesa. Papel no elenco define minutos, e minutos definem evolução.';
 const lgOpts=Object.entries(LG).map(([k,v])=>`<option value="${k}">${COUNTRY[v.c].f} ${esc(v.n)}</option>`).join('');
 shell(`<div class="phead"><div class="eyebrow">${seasonLbl(S.year)} · ${S.age} anos</div><h2>${esc(title)}</h2><p>${esc(sub)} ${OFFERS.length?'<b>Toque num card para assinar.</b>':''}</p></div>
 <div class="offers">${OFFERS.map((o,i)=>offerCard(o,i)).join('')}</div>
 <section class="card" style="display:grid;gap:10px"><div class="eyebrow">Empresário · ${S.agentUses} ligações</div><div class="row"><button class="btn small" id="agentM">📞 Ligar pra uma liga ou clube</button>${S.age>=32?'<button class="btn ghost small" id="ret">Pendurar as chuteiras</button>':''}</div></section>`,{lifeFold:true,noFast:true});
 $app.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>{acceptOffer(OFFERS[+b.dataset.off]);startPreseason()});
 const ag=document.getElementById('agentM');if(ag)ag.onclick=()=>openAgent(null,{market:true});
 const rt=document.getElementById('ret');if(rt)rt.onclick=()=>{S.retiredReason=`Decidiu parar aos ${S.age} anos.`;renderEnd()};
}

// ---------- SIMULAR CARREIRA ----------
async function fastForward(){
 if(BUSY)return;BUSY=true;
 $ov.hidden=false;$ov.innerHTML='<div class="ovwrap"><h2 style="font-size:28px;font-weight:900">Simulando a carreira…</h2><p class="muted" id="ffp"></p></div>';
 try{
  if(PAUSE){resolveOption(PAUSE,autoOption(PAUSE));PAUSE=null;EVRES=null}
  let guard=0;
  while(guard++<40){
   if(S.st&&!S.st.ended){if(!S.st.done)await stepSeason(IO_AUTO,'sim');endSeason();document.getElementById('ffp').textContent=`${S.age} anos · ${club().n}`;await sleep(0)}
   const r=mustRetire();if(r){S.retiredReason=r;break}
   if(S.age>=36&&S.ovr<70||S.age>=39){S.retiredReason=`Decidiu parar aos ${S.age} anos.`;break}
   if(S.agreed&&CLUB[S.agreed.club]){const o=S.agreed;S.agreed=null;if(S.loan)endLoan();acceptOffer(o);buildSeason();continue}
   const w=windowState();
   if(w.forced==='loanEnd')endLoan();
   else if(w.open){let o=genOffers();if(w.stay||w.renew)o.unshift(stayOffer());if(o.length)acceptOffer(autoOffer(o.slice(0,3)))}
   buildSeason();
  }
 }catch(e){console.error(e)}
 BUSY=false;$ov.hidden=true;$ov.innerHTML='';renderEnd();
}

 {const im=trophyImg(o.n,kind);if(im)return`<img class="troimg" src="${esc(im)}" alt="">`}
 const id='t'+(++TRO_N);
 const G=`url(#${id}g)`,Sv=`url(#${id}s)`,B=`url(#${id}b)`,Cr=`url(#${id}c)`,Gr=`url(#${id}r)`;
 const c1=o.c1||'#c8102e',c2=o.c2||'#ffffff';
 const defs=`<defs>
 <linearGradient id="${id}g" x1="0" x2="1"><stop offset="0" stop-color="#7a4d0e"/><stop offset=".32" stop-color="#e9bf4f"/><stop offset=".5" stop-color="#fff4c4"/><stop offset=".68" stop-color="#e2ad34"/><stop offset="1" stop-color="#7a4d0e"/></linearGradient>

function confetti(host,colors,ms=4200){
 if(reduced)return;
 const cv=document.createElement('canvas');cv.className='confetti';host.appendChild(cv);
 const ctx=cv.getContext('2d');const dpr=Math.min(2,window.devicePixelRatio||1);
 const fit=()=>{cv.width=host.clientWidth*dpr;cv.height=host.clientHeight*dpr};fit();
 const P=[];for(let i=0;i<170;i++)P.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*3.5)*dpr,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.25,w:(5+Math.random()*6)*dpr,h:(3+Math.random()*5)*dpr,c:colors[i%colors.length]});
 const t0=performance.now();
 const step=t=>{const e=t-t0;ctx.clearRect(0,0,cv.width,cv.height);ctx.globalAlpha=e>ms-800?Math.max(0,(ms-e)/800):1;
  for(const p of P){p.x+=p.vx+Math.sin((t/400)+p.r)*.6*dpr;p.y+=p.vy;p.r+=p.vr;if(p.y>cv.height+20&&e<ms-1200){p.y=-10;p.x=Math.random()*cv.width}
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
  if(e<ms&&cv.isConnected)requestAnimationFrame(step);else cv.remove()};
 requestAnimationFrame(step);
}

   await anim(sh,[{transform:'translate(0px,0px)'},{transform:'translate(14px,-6px)'},{transform:'translate(22px,-10px) rotate(-6deg)'}],{duration:420*sp,easing:'ease-in'});
   const dp=diveParams(dive);
   let[tx,ty]=PKZ[shot];let end=null,extra=null;
   if(res==='fora'){const post=ch(.4);if(post){const side=shot%3===0?42:shot%3===2?278:(ch(.5)?42:278);if(shot%3===1&&shot<3){tx=160;ty=29}else{tx=side;ty=shot<3?50:110}extra=[tx+(tx<160?24:tx>160?-24:0),ty+60]}else{if(shot<3){ty=8;tx=tx+(shot%3-1)*12}else{tx=shot%3===0?24:shot%3===2?296:tx;ty=shot%3===1?20:ty}}}
   if(res==='defesa'){tx=dp.hand[0];ty=dp.hand[1];if(ch(.45))extra=[tx+(tx<160?-38:38),ty+46]}
   const up=svg.querySelector('#armsUp'),dn=svg.querySelector('#armsDown');
   setTimeout(()=>{if(dp.up){up.setAttribute('opacity','1');dn.setAttribute('opacity','0')}},70*sp);
   const pk=anim(kp,[{transform:'translate(0px,0px) rotate(0deg)'},{transform:`translate(${dp.dx}px,${dp.dy}px) rotate(${dp.r}deg)`}],{duration:430*sp,easing:'cubic-bezier(.2,.7,.3,1)',delay:60*sp});
   anim(sw,[{opacity:1},{opacity:0}],{duration:200*sp});
   const pb=anim(ball,[{transform:'translate(160px,196px) scale(1.25)'},{transform:`translate(${tx}px,${ty}px) scale(.78)`}],{duration:400*sp,easing:'cubic-bezier(.3,.6,.4,1)'});
   await Promise.all([pk,pb]);
   const mk=$('#mark');mk.setAttribute('transform',`translate(${PKZ[shot][0]} ${PKZ[shot][1]})`);mk.setAttribute('opacity','.7');
   if(res==='gol'){anim($('#net'),[{transform:'translate(0,0)'},{transform:'translate(0,4px)'},{transform:'translate(0,-2px)'},{transform:'translate(0,0)'}],{duration:420*sp});await anim(ball,[{transform:`translate(${tx}px,${ty}px) scale(.78)`},{transform:`translate(${tx}px,${Math.min(136,ty+40)}px) scale(.74)`}],{duration:300*sp,easing:'ease-in'})}
   else if(extra){await anim(ball,[{transform:`translate(${tx}px,${ty}px) scale(.78)`},{transform:`translate(${extra[0]}px,${extra[1]}px) scale(.9)`}],{duration:420*sp,easing:'ease-out'})}
   await sleep(250*sp);
  },
 };
 return sc;
}
function teamColors(side){if(!side)return['#e8e8e8','#151515'];if(side.nat){const m={BRA:['#ffdf00','#0a7a3c'],ARG:['#75aadb','#ffffff'],FRA:['#1d3c8f','#ffffff'],ESP:['#c60b1e','#ffc400'],ENG:['#ffffff','#1d3c8f'],POR:['#c8102e','#0a7a3c'],GER:['#ffffff','#151515'],NED:['#ff7f00','#ffffff'],ITA:['#1f5fbf','#ffffff'],URU:['#5cacee','#151515'],USA:['#ffffff','#1d3c8f'],MEX:['#0a7a3c','#ffffff']};return m[side.id]||['#e8e8e8','#151515']}const c=CLUB[side.id]||side;return[c.c1||'#e8e8e8',c.c2||'#151515']}

IO_UI.shootout=function(o){
 return new Promise(async resolve=>{
  $ov.hidden=false;
  const pu=clamp(.74+(o.usS-o.themS)/120,.6,.86),pt=clamp(.74+(o.themS-o.usS)/120,.6,.86);
  const usR=sideRoster(o.us).filter(p=>p.pos!=='GOL'&&p.n!==S.name);
  const thR=sideRoster(o.them).filter(p=>p.pos!=='GOL');
  const usT=shuffle(usR).slice(0,12).map(p=>p.n),thT=shuffle(thR).slice(0,12).map(p=>p.n);
  const[uc1,uc2]=teamColors(o.us),[tc1,tc2]=teamColors(o.them);
  let myIdx=-1;let fast=false;
  const ku=[],kt=[];let a=0,b=0;
  const board=()=>`<div class="tally">${[[o.us,ku,a],[o.them,kt,b]].map(([sd,k,n])=>`<div>${shieldHTML(sd,'sm')}<b style="flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sd.n)}</b><span class="k">${Array.from({length:Math.max(5,k.length)},(_,i)=>`<i class="${k[i]===undefined?'':k[i]?'g':'m'}"></i>`).join('')}</span><b class="mono" style="font-size:20px">${n}</b></div>`).join('')}</div>`;
  const frame=(msg,sub)=>{$ov.innerHTML=`<div class="ovwrap pk"><div class="eyebrow">${esc(o.comp)} · ${esc(o.round)}</div><h2 class="pkh">Disputa de pênaltis</h2>${board()}
   <div class="pkmsg"><b>${msg}</b>${sub?`<span class="muted">${sub}</span>`:''}</div><div class="scenebox" id="scn"></div><div class="pkres" id="pkr"></div><div id="pkc"></div>
   <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost small" id="pkfast">${fast?'Rápido ligado':'Acelerar'}</button></div></div>`;
   const f=document.getElementById('pkfast');f.onclick=()=>{fast=true;f.textContent='Rápido ligado'}};
  // escolher a ordem
  if(o.iAmIn&&!o.isGK){
   myIdx=await new Promise(r=>{$ov.innerHTML=`<div class="ovwrap pk"><div class="eyebrow">${esc(o.comp)} · ${esc(o.round)}</div><h2 class="pkh">Vai pros pênaltis</h2>${board()}
    <p class="muted" style="margin:10px 0 12px">Em que ordem você bate? O primeiro tem menos pressão. O quinto pode decidir tudo.</p>
    <div class="order">${[1,2,3,4,5].map(n=>`<button class="ordbtn" data-o="${n-1}"><b>${n}º</b><span>${['Abre a série','Segundo','Meio da série','Quarto','A cobrança decisiva'][n-1]}</span></button>`).join('')}</div>
    <button class="btn ghost small" data-o="-1" style="margin-top:10px">Não quero bater</button></div>`;
    $ov.querySelectorAll('[data-o]').forEach(bt=>bt.onclick=()=>r(+bt.dataset.o))});
  }
  const kickOne=async(ours,idx)=>{
   const meKick=ours&&idx===myIdx;const meSave=!ours&&o.isGK;
   const taker=ours?(meKick?S.name:usT[idx%usT.length]):thT[idx%thT.length];
   const[c1,c2]=ours?[uc1,uc2]:[tc1,tc2];
   frame(`${idx+1}ª cobrança · ${esc(ours?o.us.n:o.them.n)}`,meKick?'Sua vez. Escolha o canto.':meSave?`${esc(taker)} vai bater. Você no gol: escolha o lado.`:`${esc(taker)} vai bater.`);
   const sc=mountScene(document.getElementById('scn'),{keeperColor:ours?'#55d0ff':'#c6f432',shooterColor:c1,shooterColor2:inkFor(c1,c2),shirt:meKick?S.shirt:'',dotMode:meSave?'save':'shoot'});
   let shot,dive,res;
   if((meKick||meSave)&&typeof nssMoment==='function'){const sk=k=>typeof skillOf==='function'?skillOf(k):.6;
    const rr=await nssMoment({kind:meKick?'pen':'keeper',pen:true,comp:o.comp,title:meKick?`${idx+1}ª cobrança: sua vez`:`${taker} vai bater`,skill:meKick?clamp(sk('FIN')-(55-S.life.cab)/300-(idx>=4?.05:0),.15,.95):sk('REF'),keeper:.5,okTxt:meKick?'GOL!':'DEFENDEU!'});
    const last=NM.last||'';res=meKick?(rr.ok?'gol':/segurou|Espalmou/.test(last)?'defesa':'fora'):(rr.ok?'defesa':/fora/i.test(last)?'fora':'gol');
    $ov.hidden=false;frame(`${idx+1}ª cobrança · ${esc(ours?o.us.n:o.them.n)}`,meKick?'Sua cobrança':'Você no gol');const sn=document.getElementById('scn');if(sn)sn.remove();
    const g=res==='gol';const good=ours?g:!g;document.getElementById('pkr').innerHTML=`<span class="${good?'good':'bad'}">${g?'GOL':res==='defesa'?'DEFENDEU':'PRA FORA'}</span>`;await sleep(800);return g}
   if(meKick){shot=await sc.pick('shoot');dive=aiDive();const press=(55-S.life.cab)/300+(idx>=4?.03:0);res=kickOutcome(shot,dive,CA().FIN,press)}
   else if(meSave){dive=await sc.pick('save');shot=aiShot();res=gkSave(shot,dive)}
   else{sc.hideDots();await sleep(fast?120:420);shot=aiShot();dive=aiDive();const p=ours?pu:pt;const want=ch(p);
    // escolhe um resultado coerente com a probabilidade
    res=want?'gol':(ch(.6)?'defesa':'fora');if(res==='gol'&&dive===shot)dive=(shot+2)%6;if(res==='defesa')dive=shot}
   await sc.kick(shot,dive,res,fast&&!meKick&&!meSave);
   const g=res==='gol';const good=ours?g:!g;
   document.getElementById('pkr').innerHTML=`<span class="${good?'good':'bad'}">${g?'GOL':res==='defesa'?'DEFENDEU':'PRA FORA'}</span>`;
   await sleep(meKick||meSave?900:(fast?250:650));
   return g;
  };
  const early=()=>{const ru=Math.max(0,5-ku.length),rt=Math.max(0,5-kt.length);return a>b+rt||b>a+ru};
  for(let r=0;r<30;r++){
   const g=await kickOne(true,r);ku.push(g);a+=g;if(r<5&&early())break;
   const h=await kickOne(false,r);kt.push(h);b+=h;
   if(r<5){if(early())break;if(r===4&&a!==b)break}else if(a!==b)break;
  }
  if(a===b)a++;
  const win=a>b;
  frame(win?'Vocês venceram nos pênaltis!':'Eliminados nos pênaltis.','');
  document.getElementById('scn').remove();
  document.getElementById('pkr').innerHTML=`<span class="${win?'good':'bad'}" style="font-size:56px">${a}–${b}</span>`;
  document.getElementById('pkc').innerHTML='<button class="btn wide" id="pkok" style="margin-top:12px">Continuar</button>';
  const bt=document.getElementById('pkok');bt.focus({preventScroll:true});bt.onclick=()=>{$ov.hidden=true;$ov.innerHTML='';resolve({win,a,b})};
 });
};

const DRILLS=[
 {k:'finish',n:'Finalização',a:'FIN',ic:'🎯'},{k:'dribble',n:'Drible',a:'DRI',ic:'🌀'},{k:'pass',n:'Passe',a:'PAS',ic:'🎯'},

async function weeklyTraining(k){
 const A=effAttrs();const d=DRILLS.find(x=>x.k===k);let hits=0,perf=0,of=3;
 const tt=(title,sub,zone,period,oneWay,btn)=>mgTiming({type:k==='header'?'header':'finish',comp:'Treino',title,sub,zone,period,oneWay,btn});
 if(k==='finish'||k==='header'||k==='sprint'||k==='tactic'){for(let i=0;i<3;i++){const z=k==='finish'?.2+(A.FIN-70)/220:k==='header'?.18+(A.FIS-70)/260:k==='sprint'?.17+(A.VEL-70)/240:.18+(A.MEN-70)/240;
   const t=await tt(`${d.n} ${i+1} de 3`,k==='sprint'?'Largue no apito, nem antes nem depois.':k==='tactic'?'Pare o vídeo no momento exato da jogada.':'O auxiliar alimenta, você executa.',z,1000-i*110,k==='header'||k==='sprint',k==='sprint'?'Largar!':k==='tactic'?'Parar!':k==='header'?'Cabecear!':'Chutar!');hits+=t.ok;perf+=t.perfect?1:0}}
 else if(k==='dribble'){const t=await mgDribble({type:'dribble',comp:'Treino',title:'Circuito de drible',sub:'Leia o marcador.',need:2,window:1200+(A.DRI-70)*12});hits=t.ok?(t.perfect?3:2):1;perf=t.perfect?1:0}
 else if(k==='pass'){for(let i=0;i<3;i++){const t=await mgPass({type:'pass',comp:'Treino',title:`Rondo ${i+1} de 3`,sub:'Ache o companheiro livre.',defs:2,speed:1+i*.15,window:2400-i*200+(A.PAS-70)*10});hits+=t.ok;perf+=t.perfect?1:0}}
 else if(k==='long'){for(let i=0;i<2;i++){const t=await mgLong({type:'long',comp:'Treino',zone:.2+(A.PAS-70)/240});hits+=t.ok?1.5:0;perf+=t.perfect?1:0}}
 else if(k==='fk'){for(let i=0;i<2;i++){const t=await mgFreeKick({type:'fk',comp:'Treino',title:`Falta ${i+1} de 2`,sub:'Barreira de bonecos.',zone:.2+(A.FIN+A.PAS-140)/400});hits+=t.ok?1.5:0;perf+=t.perfect?1:0}}
 else if(k==='reflex'){for(let i=0;i<3;i++){const t=await mgReflex({type:'reflex',comp:'Treino',title:`Reflexo ${i+1} de 3`,sub:'Máquina de chutes.',window:820-i*90+(A.REF-70)*6});hits+=t.ok}}
 hits=Math.round(hits);
 const chips=[];const st=S.st;
 if(st){const f=hits>=3?2:hits>=2?1:0;st.forma+=f;if(f)chips.push([`+${f} Forma`,'up'])}
 const gain=hits*4+perf*3+(S.perks.psico?2:0);S.xp[d.a]=(S.xp[d.a]||0)+gain;chips.push([`+${gain} XP ${ATTR_NAME[d.a]}`,'gold']);
 if(S.xp[d.a]>=100){S.xp[d.a]-=100;S.attrs[d.a]=clamp(S.attrs[d.a]+1,1,99);chips.push([`+1 ${ATTR_NAME[d.a]}`,'up']);
  const w=(POS[S.pos].w[d.a]||0);if(S.ovr<S.pot+2&&ch(clamp(w*1.6,.05,.75))){S.ovr=clamp(S.ovr+1,30,99);if(S.ovr>S.peak){S.peak=S.ovr;S.peakAge=S.age}chips.push(['+1 OVR','up'])}}
 S.coach=clamp(S.coach+(hits>=2?2:0),0,100);
 return{hits,chips};
}

const HORSES=['Relâmpago','Trovão Negro','Pé de Pano','Estrela Dalva','Ventania','Faísca','Barão','Pingo de Ouro','Furacão','Sereno','Tempestade','Corisco'];
function betOpts(){return[.001,.01,.05,.25,1].filter(v=>v<=S.din+1e-9)}
function horseRace(){
 return new Promise(res=>{
  const hs=shuffle(HORSES).slice(0,6).map((n,i)=>({n,s:R(.8,1.25),c:['#ff7a2b','#7cc4ff','#a6e39a','#f2c443','#ff6a5c','#c9a0ff'][i]}));

function blackjack(){
 return new Promise(res=>{let bet=betOpts()[0]||0,net=0,hands=0;const SUM={txt:'Você foi embora sem jogar.',chips:[]};
  const card=()=>{const v=RI(1,13);return{v,n:v===1?'A':v>10?['J','Q','K'][v-11]:String(v),s:pick(['♠','♥','♦','♣'])}};
  const val=h=>{let s=0,a=0;for(const c of h){s+=c.v>10?10:c.v===1?11:c.v;if(c.v===1)a++}while(s>21&&a){s-=10;a--}return s};
  let P=[],D=[],phase='bet',msg='';
  const ch2=c=>`<span class="pcard ${c.s==='♥'||c.s==='♦'?'red':''}">${c.n}<small>${c.s}</small></span>`;
  const draw=()=>{$ov.hidden=false;$ov.innerHTML=`<div class="ovwrap casino-ov"><div class="row" style="justify-content:space-between"><span class="eyebrow">Mesa de 21 · caixa ${money(S.din)}</span><span class="tag">🃏 21</span></div><h2 class="pkh">Vinte e um</h2>
   <div class="bjrow"><span class="eyebrow">Banca ${phase==='end'?val(D):''}</span><div>${D.map((c,i)=>phase==='play'&&i===1?'<span class="pcard back">?</span>':ch2(c)).join('')}</div></div>
   <div class="bjrow"><span class="eyebrow">Você ${P.length?val(P):''}</span><div>${P.map(ch2).join('')}</div></div>
   <div class="pkres">${msg}</div>
   ${phase==='play'?`<div class="actions"><button class="btn" id="bHit">Pedir carta</button><button class="btn ghost" id="bStand">Parar</button></div>`:`<div class="betrow"><span class="eyebrow">Aposta</span>${betOpts().map(v=>`<button class="lmbtn ${bet===v?'on':''}" data-b="${v}">${money(v)}</button>`).join('')}</div><div class="actions"><button class="btn" id="bDeal" ${!bet||S.din<bet||hands>=5?'disabled':''}>Dar as cartas</button><button class="btn ghost" id="bOut">Ir embora</button></div>`}</div>`;
   $ov.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{bet=+b.dataset.b;draw()});
   const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
   on('bOut',()=>{$ov.hidden=true;$ov.innerHTML='';res(SUM)});
   on('bDeal',()=>{S.din-=bet;hands++;P=[card(),card()];D=[card(),card()];phase='play';msg='';if(val(P)===21)return end();draw()});
   on('bHit',()=>{P.push(card());if(val(P)>21)return end();draw()});
   on('bStand',()=>end());
  };
  const end=()=>{while(val(D)<17)D.push(card());const p=val(P),d=val(D);let pay=0;
   if(p>21)msg='<span class="bad">Estourou!</span>';else if(p===21&&P.length===2&&!(d===21&&D.length===2)){pay=bet*2.5;msg='<span class="good">BLACKJACK!</span>'}else if(d>21||p>d){pay=bet*2;msg='<span class="good">Você ganhou!</span>'}else if(p===d){pay=bet;msg='Empate'}else msg='<span class="bad">A banca ganhou</span>';
   S.din+=pay;net+=pay-bet;S.casino.net+=pay-bet;phase='end';
   SUM.txt=net>=0?`Saiu da mesa de 21 com ${money(net)} a mais.`:`Perdeu ${money(-net)} no 21.`;SUM.chips=[[`${net>=0?'+':'−'}${money(Math.abs(net))}`,net>=0?'up':'down']];draw()};
  draw();
 });
}

function peneiraResult(){

 const sc=PEN.score;const tgt=clamp(V.tier+(sc-50)/90,0,1);
 const idx=Math.round((1-tgt)*(home.length-1));
 const band=home.slice(Math.max(0,idx-6),Math.min(home.length,idx+6));
 let scouts=shuffle(band).slice(0,5);
 if(sc>=82&&COUNTRY[nat.home].conf!=='EU'){const eu=shuffle(CLUBS.filter(x=>COUNTRY[x.country].conf==='EU'&&x.s>=78));scouts.push(eu[0])}
 if(S.heart&&CLUB[S.heart]&&CLUB[S.heart].country===nat.home&&!scouts.find(x=>x.id===S.heart))scouts.push(CLUB[S.heart]);
 scouts=scouts.slice(0,6);
 const want=c=>{const need=55+(c.s-home[Math.round(home.length/2)].s)*1.6+V.diff*.3;return sc+randn()*8>=need};
 let res=scouts.map(c=>({c,ok:want(c)}));
 if(!res.some(r=>r.ok)){const small=home.slice(-8);res.push({c:pick(small),ok:true})}
 PEN.interested=res.filter(r=>r.ok).sort((a,b)=>b.c.s-a.c.s).slice(0,3).map(r=>r.c);
 if(sc>=75)S.pot=clamp(S.pot+1,40,99);

 <button class="btn wide" id="go" style="animation:pop .4s ${.9+res.length*.45}s both">Ver as propostas</button></section>`);
 document.getElementById('go').onclick=()=>renderAcademy();

function swipeShot(o){
 return new Promise(res=>{
