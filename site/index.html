   <rect width="320" height="340" fill="url(#swg)"/>${[0,1,2,3,4].map(i=>`<rect y="${140+i*40}" width="320" height="20" fill="rgba(255,255,255,.025)"/>`).join('')}
   <rect x="60" y="40" width="200" height="82" fill="url(#swn)"/><path d="M60 122V40h200v82" fill="none" stroke="#ecf0e2" stroke-width="5" stroke-linejoin="round"/><path d="M30 124h260" stroke="rgba(236,240,226,.5)" stroke-width="2"/>
   ${fk?`<g id="wall">${[0,1,2,3].map(i=>`<g transform="translate(${126+i*18},160)"><rect x="-7" y="0" width="14" height="30" rx="5" fill="#c8102e"/><circle cy="-6" r="6" fill="#d9a77a"/></g>`).join('')}</g>`:''}
   <g id="kp" transform="translate(${kx} ${ky})"><rect x="-11" y="-16" width="22" height="30" rx="7" fill="#c6f432"/><circle cy="-23" r="8" fill="#d9a77a"/><rect x="-26" y="-14" width="15" height="7" rx="3.5" fill="#c6f432"/><rect x="11" y="-14" width="15" height="7" rx="3.5" fill="#c6f432"/><rect x="-10" y="14" width="8" height="14" rx="3" fill="#222"/><rect x="2" y="14" width="8" height="14" rx="3" fill="#222"/></g>
   ${hd?`<circle id="cross" cx="-20" cy="210" r="9" fill="#fff" opacity=".9"/>`:''}
   <path id="aim" d="" stroke="rgba(242,196,67,.9)" stroke-width="4" stroke-dasharray="8 6" fill="none" stroke-linecap="round"/>
   <circle id="tgt" r="0" fill="none" stroke="var(--gold)" stroke-width="3"/>
   <g id="ball" transform="translate(160 292)"><circle r="13" fill="#fff"/><path d="M-5-4l5-4 5 4-2 6h-6z" fill="#222"/><circle r="13" fill="none" stroke="rgba(0,0,0,.25)"/></g>
   <circle id="finger" cx="160" cy="292" r="26" fill="rgba(255,122,43,.18)" stroke="var(--accent)" stroke-width="2" class="swpulse"/>
  </svg>`;
  swFrame({...o,tag:fk?'Falta':hd?'Cabeçada':'Finalização',time},svg,hd?'Quando a bola chegar, <b>arraste pra cima</b> mirando no canto.':fk?'<b>Arraste da bola pro gol.</b> Curve o dedo pra dar efeito por cima da barreira.':'<b>Arraste da bola até onde quer chutar.</b> Mais longo = mais alto.');
  const sv=document.getElementById('sw'),aim=document.getElementById('aim'),ball=document.getElementById('ball'),kp=document.getElementById('kp'),tgt=document.getElementById('tgt'),fg=document.getElementById('finger');
  let start=null,path=[],done=false,ready=!hd;const t0=performance.now();
  if(hd){const cr=document.getElementById('cross');const d0=reduced?50:900;cr.animate([{transform:'translate(0,0)'},{transform:'translate(180px,70px)'}],{duration:d0,fill:'forwards',easing:'ease-out'});setTimeout(()=>{ready=true;fg.classList.add('go');cr.remove();ball.setAttribute('transform','translate(160 270)')},d0)}
  const to=setTimeout(()=>finish(null),time);
  sv.addEventListener('pointerdown',e=>{if(done||!ready)return;sv.setPointerCapture(e.pointerId);start=swPt(sv,e);path=[start]});
  sv.addEventListener('pointermove',e=>{if(!start||done)return;const p=swPt(sv,e);path.push(p);const bx=hd?160:160,by=hd?270:292;aim.setAttribute('d',`M${bx} ${by} Q ${bx+(p.x-start.x)*.5} ${by+(p.y-start.y)*.5-20} ${bx+(p.x-start.x)*1.6} ${by+(p.y-start.y)*1.15}`)});
  sv.addEventListener('pointerup',e=>{if(!start||done)return;const p=swPt(sv,e);path.push(p);finish(p)});

   let curve=0;if(path.length>4){const m=path[Math.floor(path.length/2)];const lx=start.x+dx/2,ly=start.y+dy/2;curve=clamp((m.x-lx)*-1,-60,60)}
   const noise=(1-skill)*38+4;
   let tx=160+dx*1.25+curve*.5+gauss()*noise, ty=122-clamp((-dy-40)*.42,0,120)+gauss()*noise*.7;

   const dpx=kx+dive*52,dpy=dive?90:88;const reach=dive===0?28:31;
   const bx0=160,by0=hd?270:292;const cx=bx0+curve*1.4,cy=(by0+ty)/2-40;
   const flight=reduced?60:520;const ts=performance.now();
   kp.animate([{transform:`translate(${kx}px,${ky}px)`},{transform:`translate(${dpx}px,${dpy}px) rotate(${dive*-60}deg)`}],{duration:380,delay:120,fill:'forwards',easing:'cubic-bezier(.3,.7,.3,1)'});
   await new Promise(r=>{const st=t=>{const k=Math.min(1,(t-ts)/flight);const x=(1-k)*(1-k)*bx0+2*(1-k)*k*cx+k*k*tx,y=(1-k)*(1-k)*by0+2*(1-k)*k*cy+k*k*ty;ball.setAttribute('transform',`translate(${x} ${y}) scale(${1-k*.45})`);if(k<1)requestAnimationFrame(st);else r()};requestAnimationFrame(st)});
   let ok=true,txt=o.okTxt||'GOOOL!';
   if(fk&&ty>100&&Math.abs(curve)<18&&len<150&&tx>120&&tx<200){ok=false;txt='Na barreira!'}
   else if(ty<40){ok=false;txt='Por cima do gol!'}else if(tx<60||tx>260){ok=false;txt='Pra fora!'}
   else if(Math.hypot(tx-dpx,ty-dpy)<reach){ok=false;txt='O goleiro pegou!'}
   const perfect=ok&&(tx<84||tx>236)&&ty<70;
   await swEnd(ok,ok&&perfect?'NO ÂNGULO!':txt,perfect);res({ok,perfect});
  };
 });
}

  if(!nb.length){st.pop();continue}const[nx,ny,dx,dy]=nb[0];g[y+dy/2][x+dx/2]=0;g[ny][nx]=0;st.push([nx,ny])}

// fuga: labirinto com guardas e holofote
function mgFuga(){return new Promise(res=>{
 const W=11,H=13;const g=mazeGen(W,H);const me={x:1,y:H-2};const exit={x:W-2,y:1};g[exit.y][exit.x]=0;g[me.y][me.x]=0;
 const free=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(!g[y][x]&&Math.abs(x-me.x)+Math.abs(y-me.y)>6)free.push([x,y]);
 const guards=shuffle(free).slice(0,2).map(([x,y])=>({x,y}));let lightX=0,t=30,over=false,tick=0;
 $ov.hidden=false;
 $ov.innerHTML=`<div class="ovwrap lifemg heist"><div class="lm-top"><span class="tag crime">Prisão</span><span class="eyebrow">3h da manhã</span></div><h2 class="pkh">Fuga do pavilhão</h2>
 <p class="lm-hint">Chegue ao <b>muro 🧱</b> sem ser visto. Fuja dos <b>👮 guardas</b> e não fique na <b>luz do holofote</b>.</p>
 <div class="hz-hud"><span id="fzT">⏱ 30</span><span id="fzA"></span></div><div class="hz jz" id="fz" style="grid-template-columns:repeat(${W},1fr)"></div>
 <div class="hz-pad"><button data-mv="0,-1">▲</button><div><button data-mv="-1,0">◀</button><button data-mv="1,0">▶</button></div><button data-mv="0,1">▼</button></div><div class="pkres" id="mgRes"></div></div>`;
 const box=document.getElementById('fz');
 const lit=(x)=>Math.abs(x-lightX)<=0;
 const draw=()=>{let h='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=g[y][x]?'w':'f';if(!g[y][x]&&lit(x))c+=' lit';let ic='';if(x===exit.x&&y===exit.y)ic='🧱';if(guards.some(q=>q.x===x&&q.y===y))ic='👮';if(me.x===x&&me.y===y)ic='🏃';h+=`<i class="${c}">${ic}</i>`}box.innerHTML=h};
 const bfs=(sx,sy,tx,ty)=>{const q=[[sx,sy]];const prev={};prev[sx+','+sy]=null;while(q.length){const[x,y]=q.shift();if(x===tx&&y===ty)break;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(g[ny]&&g[ny][nx]===0&&!(k in prev)){prev[k]=[x,y];q.push([nx,ny])}}}let k=tx+','+ty;if(!(k in prev))return null;let cur=[tx,ty],p=prev[k];while(p&&!(p[0]===sx&&p[1]===sy)){cur=p;p=prev[p[0]+','+p[1]]}return cur};
 const caught=()=>guards.some(q=>q.x===me.x&&q.y===me.y)||lit(me.x)&&tick%3===0&&me.y>1&&ch(.5);
 const end=ok=>{if(over)return;over=true;clearInterval(ti);clearInterval(gi);removeEventListener('keydown',kh);swEnd(ok,ok?'Pulou o muro!':'Pego na fuga',ok).then(()=>res({ok}))};
 const move=(dx,dy)=>{if(over)return;const nx=me.x+dx,ny=me.y+dy;if(!g[ny]||g[ny][nx])return;me.x=nx;me.y=ny;SFX.tone({f:260,dur:.04,gain:.05});if(nx===exit.x&&ny===exit.y)return end(true);if(guards.some(q=>q.x===nx&&q.y===ny))return end(false);draw()};
 $ov.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const[dx,dy]=b.dataset.mv.split(',').map(Number);move(dx,dy)});
 let sp=null;box.addEventListener('pointerdown',e=>{sp={x:e.clientX,y:e.clientY}});box.addEventListener('pointerup',e=>{if(!sp)return;const dx=e.clientX-sp.x,dy=e.clientY-sp.y;sp=null;if(Math.hypot(dx,dy)<14)return;Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))});
 const kh=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}};addEventListener('keydown',kh);
 const ti=setInterval(()=>{t--;document.getElementById('fzT').textContent='⏱ '+t;if(t<=0)end(false)},1000);
 let ld=1;const gi=setInterval(()=>{if(over)return;tick++;if(tick%2===0){lightX+=ld;if(lightX>=W-1||lightX<=0)ld=-ld}
  for(const q of guards){const near=Math.abs(q.x-me.x)+Math.abs(q.y-me.y)<=4;let n=null;if(near&&tick%2===0)n=bfs(q.x,q.y,me.x,me.y);else if(tick%3===0){const o=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[q.x+dx,q.y+dy]).filter(([x,y])=>g[y]&&g[y][x]===0);if(o.length)n=pick(o)}if(n){q.x=n[0];q.y=n[1]}}
  if(lit(me.x)&&ch(.18)){document.getElementById('fzA').textContent='🔦 Te viram!';return end(false)}
  if(guards.some(q=>q.x===me.x&&q.y===me.y))return end(false);draw()},300);
 draw()})}

 try{
  const uid=CLOUD.uid;
  await CLOUD.db.doc(`shared/${uid}/c/${k.cid}`).set({...k,owner:uid,at:Date.now()});
  const ref=CLOUD.db.doc('shared/'+uid);const cur=await ref.get();
  const items=((cur.exists&&cur.data().items)||[]).filter(x=>x.cid!==k.cid);
  items.push({cid:k.cid,name:k.name,flag:k.flag,pos:k.pos,tier:k.tier,pts:k.pts,nick:k.nick,peak:k.peak,t:k.nTitles,b:k.bolas,by:(typeof activeProfile==='function'?activeProfile().name:''),at:Date.now()});
  await ref.set({items:items.slice(-40)});
  return `${uid}.${k.cid}`;
 }catch(e){return null}
}
async function openShared(code){
 if(!CLOUD.db||!code)return false;
 const i=code.lastIndexOf('.');if(i<1)return false;
 const uid=code.slice(0,i),cid=code.slice(i+1);
 try{const d=await CLOUD.db.doc(`shared/${uid}/c/${cid}`).get();if(!d.exists)return false;const k=d.data();k.code=code;renderCard(k,{nav:'ranking',back:()=>renderRanking()});return true}catch(e){return false}
}

 page('ranking','<section class="card"><div class="muted">Carregando o ranking…</div></section>');
 let rows=[];
 try{const q=await CLOUD.db.collection('shared').limit(300).get();for(const d of q.docs){const it=(d.data().items||[]);for(const x of it)rows.push({...x,owner:d.id})}}catch(e){}
 if(CLOUD.screen!=='ranking')return;
 rows.sort((a,b)=>b.pts-a.pts);rows=rows.slice(0,60);
 let names={};if(CLOUD.user){try{names=await CLOUD.user.profiles([...new Set(rows.map(r=>r.owner))])}catch(e){}}
 const pf=POS_FILTER;const shown=pf==='all'?rows:rows.filter(r=>pf==='GOL'?r.pos==='GOL':pf==='DEF'?['ZAG','LE','LD','LAT'].includes(r.pos):pf==='MEIO'?['VOL','MC','MEI','ME','MD'].includes(r.pos):['PE','PD','PON','SA','ATA'].includes(r.pos));
 page('ranking',`<div><div class="eyebrow">Ranking global</div><h2 class="h2">As maiores carreiras</h2></div>
 <div class="tabs">${[['all','Geral'],['GOL','Goleiros'],['DEF','Defensores'],['MEIO','Meio-campo'],['ATQ','Atacantes']].map(([k,n])=>`<button class="tab ${pf===k?'on':''}" data-pf="${k}">${n}</button>`).join('')}</div>
 <section class="card rank">${shown.length?shown.map((r,i)=>`<button class="rankrow" data-code="${esc(r.owner+'.'+r.cid)}"><span class="pos-n mono">${i+1}</span><span class="tierdot t${r.tier}">${r.tier+1}</span><div class="info"><b>${esc(r.name)} <span class="muted" style="font-weight:500">${r.flag} ${esc(r.pos)}</span></b><span>${esc(TIERS[r.tier][1])} · ${esc(r.nick)}${r.by?` · por ${esc(r.by)}`:names[r.owner]&&names[r.owner].name?` · por ${esc(names[r.owner].name)}`:''}</span></div><div class="mine"><b class="mono">${r.pts}</b>${r.t} tít · ${r.b} BO</div></button>`).join(''):'<div class="muted">Ninguém compartilhou uma carreira ainda. A sua pode ser a primeira.</div>'}</section>`);
 document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{POS_FILTER=b.dataset.pf;renderRanking()});
 document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>openShared(b.dataset.code));
}
let POS_FILTER='all';
function localHall(){const h=hallLoad();return h.length?`<div class="lines" style="margin-top:10px">${h.map((x,i)=>`<div class="line"><span>${i+1}. <b>${esc(x.name)}</b> <span class="muted">${x.flag} ${x.pos}</span></span><span class="r">${esc(TIERS[x.tier][1])} · ${x.pts}</span></div>`).join('')}</div>`:'<div class="muted" style="margin-top:8px">Nenhuma ainda.</div>'}

const PROF_KEY='fdb3_profiles';
const PROF_EMOJI=['⚽','🦁','🔥','⭐','🐐','🦅','👑','🚀','🎯','🧤'];
function profiles(){let p=null;try{p=JSON.parse(localStorage.getItem(PROF_KEY)||'null')}catch(e){}
 if(!p||!p.list||!p.list.length)p={active:'p0',list:[{id:'p0',name:(CLOUD.me&&CLOUD.me.name)||'Jogador',emoji:'⚽'}]};return p}
function saveProfiles(p){try{localStorage.setItem(PROF_KEY,JSON.stringify(p))}catch(e){}}
function activeProfile(){const p=profiles();return p.list.find(x=>x.id===p.active)||p.list[0]}

function buildBody(phase){
 S.phase=phase;S.pauseId=PAUSE?PAUSE.id:null;if(!S.profile)S.profile=activeProfile().id;
 const data=JSON.stringify({v:3,S,W,clubs:CLUBS.map(c=>[c.id,c.l,Math.round(c.s*10)/10]),req:REQ,renew:RENEW,renewMsg:RENEW_MSG});
 const c=S.club?CLUB[S.club]:null;const L=S.done?legacy():null;
 return{meta:{cid:S.cid,name:S.name,nat:S.nat,pos:S.pos,age:S.age,club:c?c.n:'',clubId:S.club,ovr:S.ovr,peak:S.peak,phase,done:!!S.done,tier:L?L.tier:null,pts:L?L.pts:null,year:S.year,fast:!!S.fast,titles:(S.titles||[]).length,profile:S.profile,updated:Date.now()},data};
}
async function listSaves(all){
 let list=[];
 if(online()){try{const q=await CLOUD.db.collection('data/users/'+CLOUD.uid).get();list=q.docs.map(d=>({...d.data().meta,src:'conta'}))}catch(e){}}
 const ix=localIndex();for(const k in ix)if(!list.find(x=>x.cid===k))list.push({...ix[k],src:'aparelho'});
 const pid=activeProfile().id;if(!all)list=list.filter(x=>(x.profile||'p0')===pid);

// ---------- confirmação ----------
function confirmPop(title,text,okLbl){return new Promise(res=>{$ov.hidden=false;$ov.innerHTML=`<div class="ovwrap decpop campo" style="text-align:center"><div class="dp-ic">🗑️</div><h2 class="dp-t">${esc(title)}</h2><p class="dp-d">${esc(text)}</p><div class="actions" style="margin-top:14px"><button class="btn" id="cfY" style="background:linear-gradient(180deg,#ff6a5c,#d8392b);color:#fff">${esc(okLbl||'Apagar')}</button><button class="btn ghost" id="cfN">Cancelar</button></div></div>`;
 document.getElementById('cfY').onclick=()=>{$ov.hidden=true;$ov.innerHTML='';res(true)};document.getElementById('cfN').onclick=()=>{$ov.hidden=true;$ov.innerHTML='';res(false)}})}

// ---------- cards de carreira ----------
const PHASE_LBL={pre:'Pré-temporada',season:'Temporada',post:'Fim de temporada',end:'Encerrada'};
function careerCard(x,big){
 const c=CLUB[x.clubId]||CLUB[x.club]||CLUBS.find(k=>k.n===x.club);const nat=NATS[x.nat];
 if(x.done){return`<div class="ccard done"><div class="cc-l">${c?shieldHTML(c):`<span class="flagbox">${nat?nat.f:''}</span>`}</div><div class="cc-m"><b>${esc(x.name)} <span>${nat?nat.f:''} ${esc(x.pos)}</span></b><span class="cc-tier">${esc(TIERS[x.tier||0][1])}</span><small>${x.pts||0} pts de legado · auge ${x.peak||x.ovr}</small></div><div class="cc-r"><button class="btn small" data-view="${x.cid}">Ver</button><button class="ccmore" data-more="${x.cid}" aria-label="Mais">⋯</button></div></div>`}
 return`<div class="ccard ${big?'big':''}"><div class="cc-l">${c?shieldHTML(c,big?'lg':''):`<span class="flagbox">${nat?nat.f:''}</span>`}<span class="cc-ovr">${x.ovr}</span></div><div class="cc-m"><b>${esc(x.name)} <span>${nat?nat.f:''} ${esc(x.pos)}</span></b><span>${esc(x.club||'Sem clube')} · ${x.age} anos</span><small>${seasonLbl(x.year||2026)} · ${PHASE_LBL[x.phase]||'Em andamento'}${x.fast?' · ⚡ rápido':''}${x.titles?` · ${x.titles} título${x.titles>1?'s':''}`:''}</small></div><div class="cc-r">${big?'':`<button class="btn small" data-load="${x.cid}">Jogar</button>`}<button class="ccmore" data-more="${x.cid}" aria-label="Mais">⋯</button></div></div>`;
}
function bindSaveRows(list){
 document.querySelectorAll('[data-load],[data-view]').forEach(b=>b.onclick=()=>loadSave(b.dataset.load||b.dataset.view));
 document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>careerMenu((list||[]).find(x=>x.cid===b.dataset.more)||{cid:b.dataset.more}));

function careerMenu(x){
 $ov.hidden=false;
 $ov.innerHTML=`<div class="ovwrap sheetmenu"><div class="shgrab"></div><b class="sm-t">${esc(x.name||'Carreira')}</b><span class="muted" style="font-size:13px">${esc(x.club||'')} ${x.src?`· salva ${x.src==='conta'?'na sua conta':'neste aparelho'}`:''}</span>
 <div class="sm-list">${x.done?`<button data-act="view">🏅 Ver o card da carreira</button><button data-act="share">📤 Compartilhar no ranking</button>`:`<button data-act="load">▶ Continuar jogando</button>`}<button data-act="del" class="danger">🗑️ Apagar carreira</button><button data-act="close">Fechar</button></div></div>`;
 $ov.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const a=b.dataset.act;$ov.hidden=true;$ov.innerHTML='';
  if(a==='load'||a==='view')loadSave(x.cid);
  else if(a==='share'){const ok=await loadSave(x.cid);if(ok){const sb=document.getElementById('shareBtn');if(sb){sb.scrollIntoView({behavior:'smooth',block:'center'});sb.click()}}}
  else if(a==='del'){if(await confirmPop('Apagar carreira?',`${x.name||'Esta carreira'} vai sumir de vez. Não dá pra desfazer.`)){await deleteSave(x.cid);toast({ic:'🗑️',title:'Carreira apagada',ms:2200});rerenderNav()}}});
}

async function rankTop(n){if(!CLOUD.db)return[];let rows=[];try{const q=await CLOUD.db.collection('shared').limit(300).get();for(const d of q.docs){for(const x of (d.data().items||[]))rows.push({...x,owner:d.id})}}catch(e){}return rows.sort((a,b)=>b.pts-a.pts).slice(0,n)}
