[build]
  publish = "."
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/escudos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/tacas/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
